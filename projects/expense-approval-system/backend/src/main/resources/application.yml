spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expenses}
    username: ${DB_USER:expense}
    password: ${DB_PASSWORD:expense-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        generate_statistics: ${SQL_STATISTICS:false}
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: expense-app
            client-secret: ${OIDC_CLIENT_SECRET:expense-local-secret}
            scope: openid,profile
            redirect-uri: ${APP_ORIGIN:http://localhost:5173}/login/oauth2/code/keycloak
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/expense-training}
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
app:
  origin: ${APP_ORIGIN:http://localhost:5173}
