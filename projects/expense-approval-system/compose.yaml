services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense-local
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["expense-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expenses"]
      interval: 3s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local
      EXPENSE_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-expense-local-secret}
    ports: ["127.0.0.1:8180:8080"]
    volumes: ["./infra/keycloak:/opt/keycloak/data/import:ro"]
volumes:
  expense-data:
