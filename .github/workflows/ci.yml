name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: expenses_test
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense-local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U expense -d expenses_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test on PostgreSQL
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/expenses_test
          TEST_DB_USER: expense
          TEST_DB_PASSWORD: expense-local
          # Fail if backend tests accidentally depend on OIDC discovery again.
          OIDC_ISSUER: http://127.0.0.1:1/realms/unavailable
        run: ./gradlew test bootJar
      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start infrastructure
        run: |
          docker compose up -d
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8180/realms/expense-training/.well-known/openid-configuration > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Build and start backend
        working-directory: backend
        run: |
          ./gradlew bootJar
          java -jar build/libs/expense-approval-0.1.0.jar --spring.profiles.active=local > /tmp/backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/me)" = 401 ]; then exit 0; fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1
      - name: E2E with Keycloak
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Collect diagnostics
        if: failure()
        run: |
          cat /tmp/backend.log || true
          docker compose -f compose.yaml logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
